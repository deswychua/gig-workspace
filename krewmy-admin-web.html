<script id="krewmy-nav-script">
(function() {
  const toggle = document.getElementById('krewmy-nav-toggle');
  const menu = document.getElementById('krewmy-nav-menu');
  const chevron = document.getElementById('krewmy-nav-chevron');
  if (!toggle || !menu) return;
  toggle.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = menu.style.display === 'block';
    menu.style.display = open ? 'none' : 'block';
    toggle.setAttribute('aria-expanded', !open);
    if (chevron) chevron.style.transform = open ? 'none' : 'rotate(180deg)';
  });
  document.addEventListener('click', (e) => {
    const nav = document.getElementById('krewmy-role-nav');
    if (nav && !nav.contains(e.target)) {
      menu.style.display = 'none';
      toggle.setAttribute('aria-expanded', 'false');
      if (chevron) chevron.style.transform = 'none';
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && menu.style.display === 'block') {
      menu.style.display = 'none';
      toggle.setAttribute('aria-expanded', 'false');
      if (chevron) chevron.style.transform = 'none';
    }
  });
})();
</script>
